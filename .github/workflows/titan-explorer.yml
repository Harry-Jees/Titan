name: Titan explorer checks

on:
  pull_request:
    paths:
      - "titan_explorer/**"
      - "tests/test_autonomous_explorer.py"
      - ".github/workflows/titan-explorer.yml"
  push:
    branches:
      - "feature/autonomous-internet-explorer-*"
    paths:
      - "titan_explorer/**"
      - "tests/test_autonomous_explorer.py"
      - ".github/workflows/titan-explorer.yml"

permissions:
  contents: read

jobs:
  explorer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Compile Python package
        run: python -m compileall -q titan_explorer
      - name: Run isolated explorer tests
        run: python -m unittest discover -s tests -p "test_autonomous_explorer.py" -v
