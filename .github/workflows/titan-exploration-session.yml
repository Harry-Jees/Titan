name: Titan 30-minute exploration session

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Exploration duration (maximum 30)"
        required: true
        default: "30"
        type: string
      seed_url:
        description: "Optional public starting URL (leave blank for automatic discovery)"
        required: false
        default: ""
        type: string
      max_pages:
        description: "Maximum successful pages (1–1500)"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate session limits
        env:
          MINUTES: ${{ inputs.minutes }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          python - <<'PY'
          import os
          minutes = float(os.environ["MINUTES"])
          pages = int(os.environ["MAX_PAGES"])
          if not 0 < minutes <= 30:
              raise SystemExit("minutes must be greater than 0 and at most 30")
          if not 1 <= pages <= 1500:
              raise SystemExit("max_pages must be between 1 and 1500")
          PY
      - name: Run autonomous exploration
        env:
          MINUTES: ${{ inputs.minutes }}
          MAX_PAGES: ${{ inputs.max_pages }}
          SEED_URL: ${{ inputs.seed_url }}
        run: |
          args=(--minutes "$MINUTES" --max-pages "$MAX_PAGES" --output titan-exploration --verbose)
          if [ -n "$SEED_URL" ]; then args+=(--seed "$SEED_URL"); fi
          python -m titan_explorer "${args[@]}"
      - name: Upload exploration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-exploration-${{ github.run_id }}
          path: titan-exploration/
          if-no-files-found: warn
          retention-days: 14
