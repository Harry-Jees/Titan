name: Titan CI

on:
  pull_request:
  push:
    branches: [main, "development/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest requests beautifulsoup4
      - run: python -m pytest -q
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/titan-worker-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: titan-public-worker-bundle
          path: /tmp/titan-worker-bundle/
          if-no-files-found: error
          retention-days: 1
