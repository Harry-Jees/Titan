name: Titan Secure Research Crawler

on:
  schedule:
    # 10:00 PM IST (16:30 UTC) and 12:00 AM IST (18:30 UTC).
    - cron: "30 16 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      page_target:
        description: "Maximum new pages to crawl in this run (1–10000)"
        required: false
        default: "600"
        type: string

permissions:
  contents: read

concurrency:
  group: titan-secure-research-crawler
  cancel-in-progress: false

jobs:
  crawl-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TITAN_PAGE_TARGET: ${{ inputs.page_target || '600' }}
      TITAN_FETCH_TIMEOUT: "20"
      TITAN_PER_HOST_DELAY: "1"
      TITAN_MAX_PAGE_BYTES: "4000000"
      TITAN_API_BASE: ${{ vars.TITAN_API_BASE || 'https://titan-ai-core.harryjees.workers.dev' }}
      TITAN_ADMIN_TOKEN: ${{ secrets.TITAN_ADMIN_TOKEN }}
      TITAN_INGEST_CHUNK_LIMIT: "1000"
      OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
      SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
    steps:
      - name: Check out Titan
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore crawler checkpoint and public corpus
        uses: actions/cache@v4
        with:
          path: |
            training/crawl_state.json
            training/crawled_pages.jsonl
          key: ${{ runner.os }}-titan-crawler-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-titan-crawler-

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"

      - name: Validate secure ingestion configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TITAN_ADMIN_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Research ingestion is paused. Add TITAN_ADMIN_TOKEN as a repository secret matching the Titan Worker admin token."
            exit 0
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          from training.crawler_policy import CrawlerConfig
          CrawlerConfig.from_env()
          url = urlparse(os.environ["TITAN_API_BASE"])
          if url.scheme != "https" or not url.hostname:
              raise SystemExit("TITAN_API_BASE must be an HTTPS origin.")
          print("Crawler budgets and HTTPS ingestion target validated.")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Crawl public sources using DNS-pinned transport
        if: steps.config.outputs.ready == 'true'
        run: python training/crawl_web.py

      - name: Collect registered OSINT feeds using DNS-pinned transport
        id: osint
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: python training/fetch_osint_feeds.py

      - name: Summarize OSINT feed collection
        if: always() && steps.config.outputs.ready == 'true'
        env:
          OSINT_OUTCOME: ${{ steps.osint.outcome }}
        run: |
          {
            echo "## Optional OSINT feed collection"
            case "$OSINT_OUTCOME" in
              success)
                echo "Feed collection completed. Any policy-blocked or unavailable sources are listed in the step log."
                ;;
              failure)
                echo "Some registered feeds failed or were blocked. Their failures are isolated; the main crawl and successful feed records will still be sent to Titan RAG."
                ;;
              *)
                echo "OSINT feed collection did not run, likely because the earlier crawl step failed."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Index new evidence into Titan RAG
        if: steps.config.outputs.ready == 'true'
        run: python training/push_knowledge.py

      - name: Explain paused ingestion setup
        if: steps.config.outputs.ready != 'true'
        run: |
          echo "Crawler skipped. Add the TITAN_ADMIN_TOKEN repository secret to enable scheduled and manual ingestion." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-research-report-${{ github.run_id }}
          path: |
            training/crawl_state.json
            training/crawled_pages_cycle.jsonl
          if-no-files-found: ignore
          retention-days: 14
