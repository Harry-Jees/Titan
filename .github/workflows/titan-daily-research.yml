name: Titan Daily Research Cycle

on:
  schedule:
    # 06:30 UTC = 12:00 noon Asia/Kolkata.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      page_target:
        description: Target number of new pages (a goal, not a guarantee)
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: titan-daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore crawl state and corpus
        uses: actions/cache/restore@v4
        with:
          path: |
            training/crawl_state.json
            training/crawled_pages.jsonl
          key: titan-crawl-${{ github.run_id }}
          restore-keys: titan-crawl-
      - name: Install research crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Crawl public sitemaps (robots-aware and rate-limited)
        env:
          TITAN_PAGE_TARGET: ${{ inputs.page_target || '1000' }}
          TITAN_CRAWLER_CONTACT: ${{ vars.TITAN_CRAWLER_CONTACT }}
        run: python training/crawl_web.py
      - name: Plan next learning cycle
        if: always()
        run: python training/plan_next_cycle.py
      - name: Build source-attributed knowledge chunks
        if: always()
        run: python training/build_knowledge_chunks.py
      - name: Save crawl state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            training/crawl_state.json
            training/crawled_pages.jsonl
          key: titan-crawl-${{ github.run_id }}
      - name: Upload research cycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-research-${{ github.run_number }}
          path: |
            training/crawled_pages_cycle.jsonl
            training/knowledge_chunks_cycle.jsonl
            training/next_learning_goals.json
            training/crawl_state.json
          retention-days: 30
          if-no-files-found: warn
      - name: Summarize cycle
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          state = pathlib.Path("training/crawl_state.json")
          if state.exists():
              data = json.loads(state.read_text())
              print(f"New pages: {data.get('new_pages', 0)} / {data.get('target_pages', 0)}")
          for name in ("training/crawled_pages_cycle.jsonl", "training/knowledge_chunks_cycle.jsonl"):
              path = pathlib.Path(name)
              print(f"{name}: {sum(1 for _ in path.open()) if path.exists() else 0}")
          goals = pathlib.Path("training/next_learning_goals.json")
          if goals.exists():
              data = json.loads(goals.read_text())
              print(f"Next-cycle priorities: {len(data.get('next_cycle_goals', []))}")
          PY

# Candidate training is deliberately not part of the scheduled job. Teacher API
# calls may cost money and fine-tuning consumes substantial compute. Run it only
# after an explicit, budget-approved manual workflow is added and reviewed.
