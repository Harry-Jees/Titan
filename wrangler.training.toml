name = "titan-training-pipeline"
main = "src/training-pipeline.ts"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "titan-memory"
database_id = "REPLACE_WITH_DEVELOPMENT_D1_DATABASE_ID"

[vars]
TITAN_TRAINING_MODEL = "@cf/zai-org/glm-4.7-flash"

[triggers]
crons = ["30 3 * * *"]
